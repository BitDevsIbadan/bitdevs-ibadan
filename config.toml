# The URL the site is built for, preview builds override it with --base-url
base_url = "https://bitdevsibadan.org"

title = "BitDevsIbadan"
description = "BitDevs Ibadan is a community in Ibadan, Nigeria, for anyone interested in discussing and participating in the research and development of Bitcoin and related protocols and software."

compile_sass = true
build_search_index = false

generate_feeds = true
feed_filenames = ["rss.xml"]

[markdown]
# opens links to other sites in a new tab
external_links_target_blank = true
external_links_no_referrer = true

[extra]
# links shown in the header and footer, leave empty to hide
github = "https://github.com/BitDevsIbadan/bitdevs-ibadan"
x = "https://x.com/BitDevsIbadan"
luma = ""
clooza = "https://www.clooza.com/en/bitdevsibadan"

# start time of every meetup, a post can override it with time in [extra]
meetup_time = "3:00 PM"

# the venue, shown on every meetup page with directions
venue_name = "Worknub"
venue_address = "West One, Agodi GRA, Ibadan, Nigeria"
venue_hint = "Opposite Environmental Task Force"
# pins directions exactly and shows a map, remove to fall back to the address
venue_lat = 7.406077
venue_lng = 3.912405
