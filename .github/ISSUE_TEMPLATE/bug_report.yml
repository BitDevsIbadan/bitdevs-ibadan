name: Something is broken
description: A page, link, or image isn't working
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The link to the page with the problem
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: What you expected to see and what you saw instead
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Android phone, Chrome
