name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # keep this version in step with the hosting build settings
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6

      # catches broken internal links and bad front matter
      - run: zola check --skip-external-links

      - run: zola build
